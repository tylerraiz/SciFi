@PART[EDB-XWing]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/SciFi/XWing
		scale = 1.0, 1.0, 1.0
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	!MODULE[ModuleReactionWheel]{}
	
	%reactionWheelConfigured = true
	
	MODULE
	{
		name = ModuleReactionWheel
		PitchTorque = 10.0
		YawTorque = 10.0
		RollTorque = 10.0
		RESOURCE
		{
			name = ElectricCharge
			rate = 1.0
		}
	}
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 1750
		type = ServiceModule
		
		TANK
		{
			name = ElectricCharge
			amount = 36000.0
			maxAmount = 36000.0
		}
		TANK
		{
			name = Food
			amount = 330.0
			maxAmount = 330.0
		}
		TANK
		{
			name = Water
			amount = 220.0
			maxAmount = 220.0
		}
		TANK
		{
			name = Oxygen
			amount = 33332.0
			maxAmount = 33332.0
		}
		TANK
		{
			name = CarbonDioxide
			amount = 0
			maxAmount = 28780.0
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 30.0
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 116.2
		}
		TANK
		{
			name = ArgonGas
			amount = 40000
			maxAmount = 40000
		}
		
	}
	
	
}

@PART[EDB-XWing]:FOR[RealPlume]:NEEDS[SmokeScreen,RealFuels]
{
    @MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
		%powerEffectName = Pentaborane_Lower
		!fxOffset = DELETE

	}
	@MODULE[ModuleEngineConfigs]
	{
		%type = ModuleEnginesRF
	}
    PLUME
    {
        name = Pentaborane_Lower
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,0.0
        fixedScale = 1
        energy = 1
        speed = 2
    }
}

