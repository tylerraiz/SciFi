@PART[EDB-XWing-Realistic]:FOR[RealPlume]:NEEDS[SmokeScreen]
{
	PLUME
    {
        name = Turbojet
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,-0.3
        fixedScale = 1.2
        energy = 1.0
        speed = 1
    }
	PLUME
    {
        name = Hydrolox-Upper
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,-0.3
        fixedScale = 1.0
        energy = 1
        speed = 1
    }
	@MODULE[ModuleEngines*]:HAS[#engineID[AirBreathing]]
    {
        %powerEffectName = Turbojet
    }
    @MODULE[ModuleEngines*]:HAS[#engineID[ClosedCycle]]
    {
        %powerEffectName = Hydrolox-Upper
    }
    
}


